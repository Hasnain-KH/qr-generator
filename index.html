<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes"
    />
    <title>Contact Me</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      body {
        font-family:
          -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial,
          sans-serif;
        background: linear-gradient(135deg, #0f172a, #1e293b);
        min-height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        padding: 20px;
        margin: 0;
      }
      .container {
        background: #ffffff;
        border-radius: 32px;
        padding: 40px 25px;
        max-width: 420px;
        width: 100%;
        box-shadow: 0 20px 60px rgba(0, 0, 0, 0.4);
        text-align: center;
      }
      .avatar {
        width: 80px;
        height: 80px;
        background: #dbeafe;
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        margin: 0 auto 15px;
        font-size: 36px;
        color: #2563eb;
      }
      h1 {
        font-size: 24px;
        color: #0f172a;
        margin-bottom: 5px;
        font-weight: 700;
      }
      .sub-text {
        color: #64748b;
        font-size: 14px;
        margin-bottom: 25px;
        border-bottom: 1px solid #e2e8f0;
        padding-bottom: 15px;
      }
      .number-display {
        background: #f8fafc;
        padding: 12px;
        border-radius: 12px;
        color: #1e293b;
        font-size: 20px;
        font-weight: 700;
        letter-spacing: 1px;
        margin-bottom: 30px;
        border: 1px dashed #cbd5e1;
      }
      .btn-group {
        display: flex;
        flex-direction: column;
        gap: 16px;
      }
      .btn {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 12px;
        padding: 18px 20px;
        border-radius: 16px;
        text-decoration: none;
        font-size: 22px;
        font-weight: 700;
        transition:
          transform 0.2s,
          box-shadow 0.2s;
        border: none;
        cursor: pointer;
        color: white;
      }
      .btn:active {
        transform: scale(0.96);
      }
      .btn-call {
        background: #16a34a;
        box-shadow: 0 8px 24px rgba(22, 163, 74, 0.35);
      }
      .btn-call:hover {
        background: #15803d;
      }
      .btn-whatsapp {
        background: #25d366;
        box-shadow: 0 8px 24px rgba(37, 211, 102, 0.35);
      }
      .btn-whatsapp:hover {
        background: #1ebe5a;
      }
      .btn-icon {
        font-size: 28px;
      }
      .footer-note {
        margin-top: 25px;
        font-size: 12px;
        color: #94a3b8;
        background: #f1f5f9;
        padding: 8px 16px;
        border-radius: 50px;
        display: inline-block;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="avatar">📞</div>
      <h1>Connect with Me</h1>
      <p class="sub-text">Scan karein aur choose karein</p>

      <div class="number-display">📱 0314 2832602</div>

      <div class="btn-group">
        <!-- Call Button - Number nikala +923142832602 -->
        <a href="tel:+923142832602" class="btn btn-call">
          <span class="btn-icon">📞</span> Call Now
        </a>

        <!-- WhatsApp Button - Link hai wa.me/923142832602 -->
        <a
          href="https://wa.me/923142832602?text=Assalam%20o%20Alaikum!%20Maine%20aapka%20QR%20scan%20kiya%20hai."
          class="btn btn-whatsapp"
        >
          <span class="btn-icon">💬</span> WhatsApp
        </a>
      </div>

      <div style="margin-top: 20px">
        <span class="footer-note">⚡ Bina kisi app ke seedha contact</span>
      </div>
    </div>
  </body>
</html>
